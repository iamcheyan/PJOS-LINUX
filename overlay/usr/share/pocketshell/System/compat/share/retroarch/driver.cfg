# Device-tuned RetroArch overrides for RG34XX (H700, mali-fbdev).
input_driver = "sdl2"
input_joypad_driver = "linuxraw"
input_autodetect_enable = "false"
# js0 is ANBERNIC-keys. Face buttons are 0-10. The D-pad is not a button
# and not on dierct-keys-polled: the vendor DTB reports it as EV_ABS
# ABS_HAT0X (js axis 3, left -1 / right +1) and ABS_HAT0Y (js axis 4,
# up -1 / down +1). Axes 0-2 are ABS_RX/RY/RZ and stay at rest.
input_player1_joypad_index = "0"
input_device_p1 = "ANBERNIC-keys"

# Face buttons:
input_player1_a_btn = "0"
input_player1_b_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"

# Shoulder buttons:
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "9"
input_player1_r2_btn = "10"

# Menu & Navigation:
input_player1_select_btn = "6"
input_player1_start_btn = "7"
input_menu_toggle_btn = "8"

# D-pad hats. linuxraw has no h0up hat ids; these are the js axis numbers.
input_player1_up_btn = "nul"
input_player1_down_btn = "nul"
input_player1_left_btn = "nul"
input_player1_right_btn = "nul"
input_player1_up_axis = "-4"
input_player1_down_axis = "+4"
input_player1_left_axis = "-3"
input_player1_right_axis = "+3"

# Audio:
audio_driver = "null"

# Hotkeys (direct triggers without modifier so GBC can use X/Y/L/R):
input_enable_hotkey_btn = "nul"

# X: Quick Save
input_save_state_btn = "2"
# Y: Quick Load
input_load_state_btn = "3"

# L & L2: Slow Motion
input_slowmotion_btn = "4"
input_slowmotion_hold_btn = "4"

# R & R2: Fast Forward
input_toggle_fast_forward_btn = "5"
input_hold_fast_forward_btn = "5"

screenshot_directory = "/storage/pocketshell/screenshots"
