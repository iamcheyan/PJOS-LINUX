# Device-tuned RetroArch overrides for TrimUI Smart Pro (Allwinner A133).
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "false"
input_player1_joypad_index = "0"
input_device_p1 = "TRIMUI Player1"

# Face buttons (TrimUI hardware: physical A=right/305, B=bottom/304, X=top/308, Y=left/307)
input_player1_a_btn = "305"
input_player1_b_btn = "304"
input_player1_x_btn = "308"
input_player1_y_btn = "307"

# Shoulders & Triggers
input_player1_l_btn = "310"
input_player1_r_btn = "311"
input_player1_l2_axis = "+2"
input_player1_r2_axis = "+5"

# Menu & Navigation
input_player1_select_btn = "314"
input_player1_start_btn = "315"
input_menu_toggle_btn = "316"
input_player1_l3_btn = "317"
input_player1_r3_btn = "318"

# D-pad hats & Left analog stick
input_player1_up_btn = "h0up"
input_player1_down_btn = "h0down"
input_player1_left_btn = "h0left"
input_player1_right_btn = "h0right"
input_player1_analog_dpad_mode = "1"
input_player1_up_axis = "-1"
input_player1_down_axis = "+1"
input_player1_left_axis = "-0"
input_player1_right_axis = "+0"

# Right analog stick
input_player1_r_x_minus_axis = "-3"
input_player1_r_x_plus_axis = "+3"
input_player1_r_y_minus_axis = "-4"
input_player1_r_y_plus_axis = "+4"

# Audio & Video
audio_driver = "sdl2"
audio_enable = "true"
audio_sync = "true"
video_smooth = "false"

# Fast forward
input_toggle_fast_forward_btn = "311"
input_hold_fast_forward_btn = "311"
screenshot_directory = "/storage/pocketshell/screenshots"
