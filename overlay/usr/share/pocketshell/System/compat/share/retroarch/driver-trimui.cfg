# Device-tuned RetroArch overrides for TrimUI Smart Pro (Allwinner A133).
# Hardware controller: "TRIMUI Player1" (045e:028e) via sdl2 driver.
input_driver = "sdl2"
input_joypad_driver = "sdl2"
input_autodetect_enable = "true"
input_player1_joypad_index = "0"

# Face buttons (Nintendo layout on Xbox physical mappings):
# Right button (printed A) -> Xbox B (btn 1)
input_player1_a_btn = "1"
# Bottom button (printed B) -> Xbox A (btn 0)
input_player1_b_btn = "0"
# Top button (printed X) -> Xbox Y (btn 3)
input_player1_x_btn = "3"
# Left button (printed Y) -> Xbox X (btn 2)
input_player1_y_btn = "2"

# Shoulders & Triggers (SDL2 indices: LB=9, RB=10, LT=axis 4, RT=axis 5)
input_player1_l_btn = "9"
input_player1_r_btn = "10"
input_player1_l2_axis = "+4"
input_player1_r2_axis = "+5"

# System navigation (SDL2 indices: Back/Select=4, Start=6, Guide/Menu=5, L3=7, R3=8)
input_player1_select_btn = "4"
input_player1_start_btn = "6"
input_player1_l3_btn = "7"
input_player1_r3_btn = "8"

# D-pad (SDL2 indices: Up=11, Down=12, Left=13, Right=14)
input_player1_up_btn = "11"
input_player1_down_btn = "12"
input_player1_left_btn = "13"
input_player1_right_btn = "14"
input_player1_analog_dpad_mode = "1"

# Left analog stick
input_player1_l_x_minus_axis = "-0"
input_player1_l_x_plus_axis = "+0"
input_player1_l_y_minus_axis = "-1"
input_player1_l_y_plus_axis = "+1"

# Right analog stick
input_player1_r_x_minus_axis = "-2"
input_player1_r_x_plus_axis = "+2"
input_player1_r_y_minus_axis = "-3"
input_player1_r_y_plus_axis = "+3"

# Quick Menu & Hotkeys:
# Physical MENU button (Guide = btn 5) directly toggles the menu
input_menu_toggle_btn = "5"
# Also support standard Select+Start combo to exit emulator
input_enable_hotkey_btn = "4"
input_exit_emulator_btn = "6"
