# RG34XX mpv controls
# In BaseOS / SDL2 on fbdev, ANBERNIC-keys is opened as a joystick (JOY_BTN0..10)
# and PJOS D-pad is opened as keyboard arrows (UP/DOWN/LEFT/RIGHT).
# Both sets of bindings are configured so controls work regardless of input driver.

# ── B button: exit playback and return to Kanade ─────────────────────────────
JOY_BTN0 quit
b quit
B quit
q quit
Q quit
ESC quit
BS quit
GAMEPAD_ACTION_RIGHT quit
GAMEPAD_BACK quit
GAMEPAD_START quit

# ── A button: Pause / Resume ─────────────────────────────────────────────────
JOY_BTN1 cycle pause
JOY_BTN2 cycle pause
JOY_BTN3 cycle pause
ENTER cycle pause
SPACE cycle pause
GAMEPAD_ACTION_DOWN cycle pause

# ── Volume control (D-pad Up/Down, Wheel, Volume keys) ──────────────────────
UP add volume 5
DOWN add volume -5
JOY_UP add volume 5
JOY_DOWN add volume -5
VOLUME_UP add volume 5
VOLUME_DOWN add volume -5
GAMEPAD_DPAD_UP add volume 5
GAMEPAD_DPAD_DOWN add volume -5

# ── Seeking (D-pad Left/Right, Shoulder triggers L1/R1) ──────────────────────
LEFT seek -5
RIGHT seek 5
JOY_LEFT seek -5
JOY_RIGHT seek 5
JOY_BTN4 seek -10
JOY_BTN5 seek 10
GAMEPAD_DPAD_LEFT seek -5
GAMEPAD_DPAD_RIGHT seek 5
GAMEPAD_LEFT_SHOULDER seek -10
GAMEPAD_RIGHT_SHOULDER seek 10

# ── Menu / Select: Quit ──────────────────────────────────────────────────────
JOY_BTN6 quit
JOY_BTN7 quit
JOY_BTN8 quit
